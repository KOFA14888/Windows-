name: Build

# Сборка Windows-исполняемого файла. Запускается на каждый push и вручную
# (Actions → Build → Run workflow), поэтому .exe можно получить, не имея
# на руках ни Windows, ни Visual Studio.
on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

env:
  DOTNET_NOLOGO: 'true'
  DOTNET_CLI_TELEMETRY_OPTOUT: 'true'
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 'true'
  CONFIGURATION: Release
  APP_PROJECT: src/Win10Sim.App/Win10Sim.App.csproj
  TEST_PROJECT: tests/Win10Sim.Core.Tests/Win10Sim.Core.Tests.csproj

jobs:
  build:
    name: Build and test
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Info
        run: dotnet --info

      - name: Restore
        run: dotnet restore Win10Sim.sln

      - name: Build
        run: dotnet build Win10Sim.sln -c $env:CONFIGURATION --no-restore -warnaserror

      # Тесты запускаются через pwsh-обёртку: при падении вывод превращается в
      # аннотации ::error::, которые видны через GitHub API (и в PR, и в агенте).
      - name: Test
        shell: pwsh
        run: |
          $log = dotnet test $env:TEST_PROJECT -c $env:CONFIGURATION --no-build `
                   --logger "console;verbosity=normal" `
                   --logger "trx;LogFileName=results.trx" `
                   --results-directory TestResults 2>&1 | Out-String

          Write-Host $log
          $log | Out-File -FilePath test-output.txt -Encoding utf8

          $testSummary = ($log -split "`r?`n" | Where-Object { $_ -cmatch '^(Failed|Passed|Skipped)!' } | Select-Object -Last 1)
          if (-not [string]::IsNullOrWhiteSpace($testSummary)) {
            Write-Host "::notice::$($testSummary.Trim())"
          }

          if ($LASTEXITCODE -ne 0) {
            # GitHub показывает не больше 10 аннотаций на шаг, поэтому берём
            # только строки с падениями (регистрозависимо: «Passed ...SpecificError»
            # не должно попадать в фильтр).
            $relevant = $log -split "`r?`n" | Where-Object {
              $_ -cmatch '\[FAIL\]|^\s*Failed [!:]|Assert\.|Error Message|Expected:|Actual:'
            } | Select-Object -First 9

            $summary = ($log -split "`r?`n" | Where-Object { $_ -cmatch '^(Failed|Passed|Skipped)!' } | Select-Object -Last 1)
            Write-Host "::error::$([string]::IsNullOrWhiteSpace($summary) ? 'dotnet test завершился с ошибкой' : $summary.Trim())"

            foreach ($line in $relevant) {
              $clean = ($line -replace '%', '%25' -replace '\r', '').Trim()
              if ($clean.Length -gt 0) { Write-Host "::error::$clean" }
            }
            exit 1
          }

      # --- Вариант 1: автономный single-file exe (~150 МБ). Запускается на любой
      #     Windows 10/11 без установленного .NET Runtime — это то, что нужно
      #     пользователю, который просто хочет запустить симулятор.
      - name: Publish self-contained single-file exe
        run: >
          dotnet publish $env:APP_PROJECT
          -c $env:CONFIGURATION
          -r win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true
          -p:DebugType=None
          -p:DebugSymbols=false
          -o publish/standalone

      # --- Вариант 2: компактный framework-dependent exe (~1 МБ + ресурсы).
      #     Требует .NET 8 Desktop Runtime, зато собирается за секунды и удобен
      #     для отладки.
      - name: Publish framework-dependent exe
        run: >
          dotnet publish $env:APP_PROJECT
          -c $env:CONFIGURATION
          -r win-x64
          --self-contained false
          -p:PublishSingleFile=true
          -p:DebugType=None
          -p:DebugSymbols=false
          -o publish/framework-dependent

      - name: Collect artifacts info
        shell: pwsh
        run: |
          Get-ChildItem publish -Recurse -File |
            Select-Object FullName, @{ n = 'MB'; e = { [math]::Round($_.Length / 1MB, 2) } } |
            Format-Table -AutoSize

      - name: Upload test output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            TestResults/
            test-output.txt
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload standalone exe
        uses: actions/upload-artifact@v4
        with:
          name: Win10Sim-standalone-win-x64
          path: publish/standalone/Win10Sim.App.exe
          if-no-files-found: error
          retention-days: 30

      - name: Upload framework-dependent build
        uses: actions/upload-artifact@v4
        with:
          name: Win10Sim-framework-dependent-win-x64
          path: publish/framework-dependent/
          if-no-files-found: error
          retention-days: 30

      - name: Summary
        shell: pwsh
        run: |
          $exe = Get-Item publish/standalone/Win10Sim.App.exe
          @"
          ### Windows 10 Simulator

          | Файл | Размер |
          |---|---|
          | ``Win10Sim.App.exe`` (автономный, single-file) | $([math]::Round($exe.Length / 1MB, 1)) МБ |
          | ``Win10Sim.App.exe`` (framework-dependent) | $([math]::Round((Get-Item publish/framework-dependent/Win10Sim.App.exe).Length / 1MB, 1)) МБ |

          Автономная сборка не требует установленного .NET: скачайте артефакт
          ``Win10Sim-standalone-win-x64`` и запустите exe.
          Выход из симулятора — клавиша ``Insert``.
          "@ >> $env:GITHUB_STEP_SUMMARY

  # Публикация exe в GitHub Release. Запускается по тегу v* и вручную
  # (Actions → Build → Run workflow): каждый прогон создаёт релиз с уникальным
  # тегом, поэтому ссылка на скачивание не ломается при следующих сборках.
  release:
    name: Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Download standalone exe
        uses: actions/download-artifact@v4
        with:
          name: Win10Sim-standalone-win-x64
          path: dist/standalone

      - name: Download framework-dependent build
        uses: actions/download-artifact@v4
        with:
          name: Win10Sim-framework-dependent-win-x64
          path: dist/framework-dependent

      - name: Pack assets
        shell: pwsh
        run: |
          Get-ChildItem dist -Recurse -File | Select-Object FullName, Length | Format-Table -AutoSize
          Move-Item dist/standalone/Win10Sim.App.exe dist/Win10Sim-standalone-win-x64.exe
          Compress-Archive -Path dist/framework-dependent/* -DestinationPath dist/Win10Sim-framework-dependent-win-x64.zip -Force

      - name: Create release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = if ($env:GITHUB_REF -like 'refs/tags/*') { $env:GITHUB_REF -replace '^refs/tags/', '' } else { "build-$($env:GITHUB_RUN_NUMBER)" }
          $notes = @"
          Симулятор Windows 10 (C# + WPF, .NET 8). Сборка из коммита ``$($env:GITHUB_SHA.Substring(0, 7))``.

          **Как запустить**
          1. Скачайте ``Win10Sim-standalone-win-x64.exe`` (не требует установленного .NET).
          2. Запустите: приложение откроется на весь экран без рамок.
          3. Выход — клавиша ``Insert`` (единственный способ).

          ``Win10Sim-framework-dependent-win-x64.zip`` — тот же симулятор, но требует .NET 8 Desktop Runtime;
          собирается за секунды и удобен, если runtime уже установлен.

          Состояние установки сохраняется в ``%LocalAppData%\Win10Sim\state.json``.
          "@
          gh release create $tag dist/Win10Sim-standalone-win-x64.exe dist/Win10Sim-framework-dependent-win-x64.zip `
            --title "Windows 10 Simulator $tag" --notes $notes --target $env:GITHUB_SHA --prerelease
